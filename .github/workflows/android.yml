name: Android CI

on:
  push:
    branches: [ main, master, v2.7-open-mobility ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend typecheck
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm run test:unit
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"
      - name: Install Android 37 SDK and Build Tools
        run: android sdk install --canary platforms/android-37 build-tools/36.0.0
      - name: Static verification
        run: python3 scripts/verify-distribution.py
      - run: chmod +x gradlew
      - run: ./gradlew clean test assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: credisafe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Audit and prepare a lockfile remediation candidate
        working-directory: backend
        run: |
          npm ci
          npm audit fix --package-lock-only --no-fund || true
          node -e "const fs=require('fs'); const b=fs.readFileSync('package-lock.json').toString('base64'); for(let i=0;i<b.length;i+=2048) console.log('CS_LOCK_CHUNK_'+(i/2048)+'_'+b.slice(i,i+2048));"
          npm ci
          npm audit --omit=dev
